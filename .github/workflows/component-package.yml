name: Vector Component Package

on:
  pull_request:
    paths:
      - "tools/component-package.mjs"
      - "test/component-package.test.mjs"
      - "tools/installer-integration.mjs"
      - "test/installer-integration.test.mjs"
      - ".github/workflows/component-package.yml"
  push:
    branches: [main]
    paths:
      - "tools/component-package.mjs"
      - "test/component-package.test.mjs"
      - "tools/installer-integration.mjs"
      - "test/installer-integration.test.mjs"
      - ".github/workflows/component-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Component package (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [26.7.0, 26.11.1]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify the atomic payload contract
        run: node --test test/component-package.test.mjs test/installer-integration.test.mjs
