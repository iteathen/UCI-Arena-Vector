name: CUDA-MCGS External Consumer

on:
  pull_request:
    paths:
      - "test/mcgs-external-consumer/**"
      - ".github/workflows/mcgs-external-consumer.yml"
  push:
    branches:
      - main
    paths:
      - "test/mcgs-external-consumer/**"
      - ".github/workflows/mcgs-external-consumer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcgs-external-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Installed MCGS consumer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out exact Vector candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up qualification Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
      - name: Check external-consumer fixture syntax
        run: |
          node --check test/mcgs-external-consumer/shared.mjs
          node --check test/mcgs-external-consumer/domain.mjs
          node --check test/mcgs-external-consumer/policy.mjs
          node --check test/mcgs-external-consumer/resource.mjs
          node --check test/mcgs-external-consumer/progress.mjs
          node --check test/mcgs-external-consumer/output.mjs
          node --check test/mcgs-external-consumer/package.mjs
          node --check test/mcgs-external-consumer/profile.mjs
          node --check test/mcgs-external-consumer/run.mjs
      - name: Pack exact protected MCGS and exercise public composition
        run: node test/mcgs-external-consumer/run.mjs
