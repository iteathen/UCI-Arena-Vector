  name: frozen LatticeKnight FP32 independent checkpoint-bound policy/value oracle
  state: >
    Vector PR #24 is protected-complete at merge
    ca3cce162a73a664a789f6a27a819097ec994bd6 / tree
    2182527aa9cd058824d3658a549a2f8224d18db5 with protected Repository quality
    34023725885 and Model Tensor Coverage 34023725845 both successful. The current
    exact public pair is cuda-js-tensor@0.1.0-alpha.6 at
    0da2c70a0a10df908a33e842aa4ba3dbd7605c48 over cuda-js@0.1.0-alpha.18 at
    45a9ef15537b52d6fd7c615b7e596676dfd00587. The frozen FP32 mapping now has one
    exact normalized TensorProgram/TensorPlan, typed callable ABI and exact
    workspace/resource facts. Per-item workspace is 33194524 bytes; capacity 2
    requires 66389048 bytes and remains under the public 67108864-byte default;
    capacity 3 requires 99583572 bytes and fails closed with
    TENSOR_DEVICE_WORKSPACE_LIMIT before compiler work. No new generic Tensor or
    CUDA capability gap remains. Producer precision promotion/default activation
    remain pending/false and are separate from this correctness candidate.
  action: >
    Obtain or independently produce checkpoint-bound policy/value oracle vectors
    for the exact frozen checkpoint SHA-256
    62dec13c22a4414db6b78ea9b6ca76bcf6f29a16a963c01d13d947d158b09c7e.
    Bind each oracle case to exact input bytes/features and checkpoint identity,
    then compare the protected public Tensor mapping for full capacity-2 occupancy
    and partial admitted occupancy without deriving expected outputs from the
    Vector mapper under test. Prove tolerance policy, mismatch failure behavior
    and terminal cleanup. If independent evidence demonstrates a generic Tensor
    or CUDA defect, route it to its natural owner; do not add a Vector-private or
    native workaround.
  exit: >
    The frozen FP32 qualification candidate has independent checkpoint-bound
    policy/value reference outputs, full and partial admitted-item comparisons
    through the protected public Tensor path, explicit numerical tolerances,
    exact package/checkpoint/input identity, mismatch falsifiers and terminal
    cleanup. Only then may the first-real-model correctness gate be called
    complete and CUDA-MCGS #124 consume the public generic callable/resource
    facts for evaluator integration. Producer FP32/fp16 promotion/default
    selection remains a separate producer qualification fact.

