native_code_diagnostic:
  rule: >
    Vector production never adds C, C++, CUDA C++, PTX, native addons, direct
    CUDA FFI, or native subprocess search as a workaround. An apparent need for
    native code is evidence of missing library/boundary coverage and is
    classified before implementation.
  routing:
    generic_cuda_mechanism: cuda-js
    generic_tensor_math: cuda-js-tensor
    universal_mcgs_semantics: cuda-mcgs
    product_meaning: Vector JavaScript/restricted Device-JS or published external contract
    reusable_chess_tablebase_mechanism: assess separate reusable Node-compatible library before any native Vector path
    no_natural_owner: architecture_gap_plan

allowed_before_cuda_mcgs_semantic_acceptance:
  - product contracts and schemas
  - chess reference/differential fixture design
  - restricted Device-JS feasibility for product modules
  - model semantic/TensorProgram mapping design
  - Book Forge consumer contract coordination
  - Timing Evidence consumer contract design
  - tablebase reusable-library coverage assessment and root-authority contract
  - UCI/session mapping design
  - release/component contract design

blocked_before_cuda_mcgs_semantic_acceptance:
  - production CUDA-MCGS Search Program lowering
  - production GPU graph/policy/evaluator integration
  - native/support/strength/performance claims

p2_non_blockers:
  - tensor material arena
  - typed_or_strided_batched_cublaslt
  - lower_precision_and_tensor_cores
  - cublasdx_or_cutlass_fusion
  - cuda_graphs_or_cooperative_execution
  - multi_gpu
  - internal_gpu_tablebase_acceleration
  - speculative_or_prospective_evaluation

validation:
  - no private sibling-repository imports
  - no Vector native production source
  - no host-produced active-search intermediate
  - exact owner-neutral contracts
  - finite resources and bounded diagnostics
  - exact failure cancellation and cleanup semantics
  - differential chess/model/tablebase oracles before promotion
