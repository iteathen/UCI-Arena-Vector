hard_rules:
  - no Vector-maintained C/C++/CUDA/PTX/native FFI
  - no Python in this portfolio
  - no private sibling-repository imports
  - no host-produced active-search intermediate after ignition
  - no self-derived expected outputs presented as an independent numerical oracle
  - exact model math or precision is not changed merely to fit an existing library surface
  - accepted-but-unimplemented Tensor authority is not reported as implemented capability
  - generic CUDA gaps route to cuda-js
  - generic Tensor math/dtype/item/ABI/workspace gaps route to cuda-js-tensor
  - reusable NN semantics route to cuda-nn only if issue #2 justifies them
  - chess/UCI/model/head/book/timing/tablebase meaning remains product-owned
  - portable/package evidence never promotes native/provider/hardware support
