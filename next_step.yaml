schema_version: 1
updated: 2026-08-26
status: foundation_connector_planning
objective: >
  Establish UCI Arena Vector as an independent Node-hosted GPU-resident UCI
  engine that consumes cuda-mcgs, cuda-js, cuda-js-tensor, Book Forge, Timing
  Evidence, tablebase, Manager and Installer only through explicit public LEGO
  contracts, with no Vector-maintained native escape path.

product:
  name: UCI Arena Vector
  repository: iteathen/UCI-Arena-Vector
  executable_stem: uci_arena_vector

current_focus:
  id: VECTOR-CONTRACT-FOUNDATION-001
  action: >
    Freeze the first Vector-owned product contracts and issue train: chess
    Domain/Policy specialization, model-to-Tensor evaluator mapping, UCI/Search
    Session mapping, Book Forge consumer, Timing Evidence consumer, tablebase
    authority, observation/evidence, and component/release integration. Build
    reference fixtures and schemas only; do not lower production GPU search
    before CUDA-MCGS #122 accepts the universal semantic packet.
  exit: >
    Every P0 connector has one owner, one public boundary, exact dependency and
    acceptance criteria, and no unresolved requirement implies native code,
    private sibling imports, host-driven search progress, or another component
    identity impersonation.

