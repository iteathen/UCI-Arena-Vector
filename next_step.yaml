objective: >
  Build UCI Arena Vector as an independent Node-hosted GPU-resident UCI engine
  that consumes cuda-mcgs, cuda-js, cuda-js-tensor, Book Forge, Timing Evidence,
  tablebase, Manager and Installer only through explicit public LEGO contracts,
  with no Vector-maintained native escape path.

