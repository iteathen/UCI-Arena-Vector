  name: UCI Arena Vector
  repository: iteathen/UCI-Arena-Vector
  executable_stem: uci_arena_vector
  parent_issue: 1

current_focus:
  id: VECTOR-CHESS-DOMAIN-POLICY-001
  issue: 2
  authority: docs/specs/VECTOR-0001-chess-search-product.md
  action: >
    Specify the Vector-owned packed chess state/action/history/terminal contract,
    product MCGS Policy/output semantics, and independent differential oracle
    corpus. Work only on product contracts, reference fixtures, schemas and
    restricted-Device-JS feasibility. Do not perform production CUDA-MCGS
    lowering before CUDA-MCGS #122 accepts the integrated universal semantic
    packet.
  exit: >
    The chess Domain/Policy contract has exact ranges, identities, history and
    root-restriction semantics; the differential oracle plan covers legal moves,
    transition, terminal/draw, promotions, castling, en-passant and history
    collisions; and no requirement implies host callbacks, private imports or
    Vector native code.

