current_focus:
  id: VECTOR-MODEL-TENSOR-003
  issue: 3
  name: frozen LatticeKnight FP32 qualification-candidate TensorProgram/TensorPlan workspace and oracle
  state: >
    Protected Vector PR #22 freezes FP32 only as the explicit LatticeKnight
    correctness qualification candidate. Merge
    118feaee28c7497e0ed4c027687793e840c95bc1 has protected tree
    e877751ff809fafbedd7071d05c5fc7c53f719fc, with protected Model Tensor
    Coverage 34015432262 and Repository quality 34015432259 both successful.
    Precision profile latticeknight-4m-inference-precision-v1 binds
    selectionRole=qualification_candidate, candidate=fp32, computeDtype=f32 and
    public I/O f32. Frozen producer promotion/default activation remain pending
    and false; training FP16 autocast is not inference-selection authority. On
    this FP32 candidate the exact protected Tensor pair selects the canonical
    SPEC-0010+SPEC-0011 mixed TensorProgram contract with zero coarse operation
    gaps, but workspace remains null and no complete concrete TensorProgram or
    TensorPlan resource result has yet been frozen.
  action: >
    Construct one exact normalized FP32 LatticeKnight TensorProgram from the
    frozen product-owned graph and checkpoint layout using only public
    cuda-js-tensor. Create the corresponding TensorPlan and existing public
    item-device callable profile where applicable, and derive exact material,
    per-item workspace, parameter/input/output and callable resource facts from
    the actual normalized program rather than the coarse operation inventory.
    Then compare full and partial item batches against an independent frozen-model
    oracle and prove exact package/target identity and terminal cleanup. If the
    concrete model demonstrates a missing generic Tensor math/dtype/item/ABI/
    workspace capability, route it to CUDA-JS-Tensor #22; if it demonstrates a
    missing consumer-neutral CUDA mechanism, route it to CUDA-JS. Do not change
    model math/precision, insert compensating casts, widen f16/bf16 erf/tanh, or
    create a Vector-private/native path.
  exit: >
    The frozen FP32 qualification candidate has complete implemented public
    operation/spec/resource coverage, one exact normalized TensorProgram/
    TensorPlan and workspace bound, a typed policy/value output ABI, full and
    partial item-batch oracle results, exact package/target identity and terminal
    cleanup; every uncovered generic requirement is routed to exactly one natural
    owner. Producer FP32/fp16 promotion/default selection remains a separate
    producer qualification fact and is not required to call this correctness
    candidate complete.

