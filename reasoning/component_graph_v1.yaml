schema: uci_arena_component_reasoning_graph_v1
graph_id: uci_arena_vector
version: 1
status: initial_owner_directed
component: uci_arena_vector
global_graph:
  repository: iteathen/uci-arena-installer
  path: reasoning/suite_graph_v1.yaml

imports:
  objectives: [G-O1, G-O2]
  premises: [G-P4, G-P5, G-P6, G-P8, G-P10, G-P11, G-P12, G-P13, G-P15, G-P17, G-P19, G-P20, G-P22, G-P23, G-P25, G-P27, G-P28]
  targets: [G-T1, G-T4, G-T5, G-T6, G-T10, G-T13, G-T15]

local_objectives:
  - id: V-O1
    statement: >
      Produce the strongest practical legal chess decisions possible from the available
      model, search, knowledge, compute, and clock resources.
    derived_from: [G-O1]
    confidence: 0.995
  - id: V-O2
    statement: >
      Behave as a predictable conforming UCI engine that can be fairly tested and replaced
      inside or outside UCI Arena.
    derived_from: [G-O2, G-T5]
    confidence: 0.97

premises:
  - id: V-P1
    statement: Chess-rule and legal-move truth is a prerequisite for every strength claim.
    confidence: 0.999
  - id: V-P2
    statement: >
      Search quality, model quality, knowledge, time allocation, and runtime efficiency are
      different mechanisms whose value is ultimately measured by downstream chess outcome.
    confidence: 0.98
  - id: V-P3
    statement: >
      Continuous search progress and downstream publication timing are separable authorities:
      timing can observe bounded completed search evidence without requiring timing commands
      to control search attention, topology, or queues.
    confidence: 0.98
  - id: V-P4
    statement: >
      Current game clock facts and evidence-qualified useful timing structure are distinct
      timing authorities and must be composed rather than substituted for one another.
    confidence: 0.995
  - id: V-P5
    statement: >
      A minimum useful timing block identifies a meaningful additional search-time purchase,
      not an optimal maximum move duration.
    confidence: 0.999
  - id: V-P6
    statement: >
      Resolved book/tablebase/sole-authority moves and search-derived moves can have different
      timing applicability without changing search truth.
    confidence: 0.97
  - id: V-P7
    statement: >
      GPU residency, low latency, and throughput are valuable only insofar as they improve
      chess quality, clock efficiency, or usability without invalidating semantics.
    confidence: 0.97

  - id: V-P8
    statement: >
      Practical engine strength is conditional on rule context, time control, model and
      knowledge configuration, timing policy, runtime/hardware, and resource availability;
      strength evidence does not silently generalize across those changes.
    confidence: 0.995
  - id: V-P9
    statement: >
      Search statistics, evaluator agreement, depth, visits, and throughput are proxies for
      decision quality rather than the objective itself.
    confidence: 0.99
  - id: V-P10
    statement: >
      Book, tablebase, timing, and model changes can mask or amplify search-policy changes in
      comparative games unless they are fixed or explicitly treated as experimental factors.
    confidence: 0.99
  - id: V-P11
    statement: >
      Behavior-affecting game inputs such as model, rule context, book/tablebase binding, and
      timing policy must remain latched over the game scope whose result they explain.
    confidence: 0.995

  - id: V-P12
    statement: >
      Independent chess/model correctness evidence requires an oracle or expected-output
      derivation that does not merely reuse the material implementation being validated.
    confidence: 0.999
  - id: V-P13
    statement: >
      Portable/software qualification and native GPU/live playing-strength qualification are
      distinct evidence layers even when they exercise the same public contract.
    confidence: 0.999

implicit_assertions:
  - id: V-A1
    statement: >
      A faster search implementation that produces worse decisions under equal real clock
      resources is not a successful chess optimization.
    derived_from: [V-O1, V-P2]
    confidence: 0.98
  - id: V-A2
    statement: >
      A local clock-safety repair cannot become general timing authority without evidence
      that its allocation behavior serves downstream chess strength.
    derived_from: [G-P8, V-P4, V-P5]
    confidence: 0.999
  - id: V-A3
    statement: >
      One qualified 500 ms block demonstrates at most that the block was useful in its
      qualified regime; it does not prove that additional blocks lack value.
    derived_from: [V-P5, G-P6]
    confidence: 0.999
  - id: V-A4
    statement: >
      Candidate instability, close alternatives, decisive stable candidates, temporal value,
      and clock scarcity are distinct potential timing pressures and should not be flattened
      into a guessed multiplier without evidence.
    derived_from: [V-P2, G-P6, G-P12]
    confidence: 0.98
  - id: V-A5
    statement: >
      Rich diagnostics or host observations that materially stall device search can reduce
      the strength being measured and therefore require bounded evidence of value.
    derived_from: [G-P10, V-O1]
    confidence: 0.95
  - id: V-A6
    statement: >
      A legal current move must remain publication-fenced to the current root/focus even when
      reusable search knowledge from earlier positions remains valid.
    derived_from: [G-T1, V-P3]
    confidence: 0.99

  - id: V-A7
    statement: >
      More visits, greater depth, higher NPS, or better GPU utilization is not automatically
      stronger chess when compared under equal real clock/resource constraints.
    derived_from: [V-P9, G-P25]
    confidence: 0.995
  - id: V-A8
    statement: >
      Better local evaluator agreement or tactical-case success does not by itself establish
      better whole-game strength.
    derived_from: [V-P9, G-P25]
    confidence: 0.99
  - id: V-A9
    statement: >
      A search/model comparison that changes book, tablebase, timing policy, or rule context
      at the same time cannot cleanly attribute the result to search/model quality.
    derived_from: [V-P10, G-P17]
    confidence: 0.995
  - id: V-A10
    statement: >
      A timing policy can remain clock-safe after a model/search/runtime change while no
      longer being strength-optimal for that changed engine.
    derived_from: [V-P8, V-P4, G-P6]
    confidence: 0.99
  - id: V-A11
    statement: >
      Mid-game replacement of a behavior-affecting model, timing policy, rule context, or
      knowledge binding makes the game unsuitable as ordinary evidence for either unchanged
      configuration.
    derived_from: [V-P11, G-P22]
    confidence: 0.995

  - id: V-A12
    statement: >
      Expected policy/value/chess outputs generated by the same mapper or implementation under
      test can self-confirm the same defect and therefore are not an independent correctness
      oracle.
    derived_from: [V-P12, G-P27]
    confidence: 0.999
  - id: V-A13
    statement: >
      Passing portable JavaScript or mocked device tests cannot by itself establish native GPU
      support, performance, or playing strength.
    derived_from: [V-P13, G-P28]
    confidence: 0.999

